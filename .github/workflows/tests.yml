name: core-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest openai anthropic google-genai typesafe-sdk numpy pillow opencv-python-headless
      - run: python -m pytest -q
